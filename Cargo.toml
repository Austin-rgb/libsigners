[package]
name = "libsigners"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
anyhow = "1"
chrono = "0.4.42"
uuid = { version = "1.7", features = ["v4", "serde"] }
